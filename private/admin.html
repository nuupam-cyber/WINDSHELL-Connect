<!doctype html>
<html lang="th">
<!-- private/admin.html — หน้าจัดการระบบ อยู่ในโฟลเดอร์ private/ จึงเปิดเป็นไฟล์ static ไม่ได้
     server ส่งหน้านี้ผ่าน GET /admin เฉพาะผู้ที่ล็อกอินแล้วและมีสิทธิ์ user.manage
     เนื้อหาแต่ละแท็บถูกวาดลงใน #content โดย admin.js -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการระบบ | WINDSHELL Connect</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310272f'/%3E%3Cpath d='M5 11c4-4 8 4 12 0s5-3 10 0M5 17c4-4 8 4 12 0s5-3 10 0M5 23c4-4 8 4 12 0s5-3 10 0' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>try{var t=localStorage.getItem('wc-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body class="admin">
  <div class="admin-shell">
    <aside class="side">
      <div class="side-brand">
        <span class="logo sm"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 10c4-4 8 4 12 0s6-3 12 0M4 17c4-4 8 4 12 0s6-3 12 0M4 24c4-4 8 4 12 0s6-3 12 0"/></svg></span>
        <div class="lbl"><strong>จัดการระบบ</strong><small>WINDSHELL Connect</small></div>
      </div>
      <!-- เมนูแท็บ: data-tab ตรงกับชื่อใน views ของ admin.js -->
      <nav class="side-nav" aria-label="เมนูจัดการระบบ">
      <button class="tab active" data-tab="overview" title="ภาพรวม"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="lbl">ภาพรวม</span></button>
      <button class="tab" data-tab="users" title="ผู้ใช้"><svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lbl">ผู้ใช้</span></button>
      <button class="tab" data-tab="roles" title="Role"><svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="lbl">Role</span></button>
      <button class="tab" data-tab="permissions" title="Permission"><svg class="i" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg><span class="lbl">Permission</span></button>
      <button class="tab" data-tab="acl" title="สิทธิ์ (ACL)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span class="lbl">สิทธิ์ (ACL)</span></button>
      <button class="tab" data-tab="categories" title="ประเภทงาน"><svg class="i" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg><span class="lbl">ประเภทงาน</span></button>
      <button class="tab" data-tab="property" title="ห้องและพื้นที่"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span class="lbl">ห้องและพื้นที่</span></button>
      <button class="tab" data-tab="logs" title="Log การใช้งาน"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="lbl">Log การใช้งาน</span></button>
      </nav>
      <div class="side-foot">
        <a class="btn" href="/" title="กลับหน้าหลัก"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span class="lbl">กลับหน้าหลัก</span></a>
        <button id="logoutBtn" title="ออกจากระบบ"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl">ออกจากระบบ</span></button>
        <button id="sideToggle" class="side-toggle" type="button" aria-expanded="true" title="ย่อเมนู"><svg class="i" viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg><span class="lbl">ย่อเมนู</span></button>
      </div>
    </aside>
    <div class="admin-body">
      <header class="admin-top">
        <div class="top-title"><h1 id="pageTitle">ภาพรวมระบบ</h1><p id="pageSub" class="muted"></p></div>
        <div class="top-actions">
          <a id="bellLink" class="iconbtn" href="/" title="การแจ้งเตือน (ดูที่หน้าหลัก)" aria-label="การแจ้งเตือน">
            <svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="bellDot" class="bell-dot hidden"></span>
          </a>
          <button id="themeBtn" class="iconbtn" type="button" title="สลับโหมดมืด/สว่าง" aria-label="สลับโหมดมืดหรือสว่าง"></button>
          <button id="meBtn" class="iconbtn user-btn" type="button" title="บัญชีของฉัน">
            <svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="meName"></span>
          </button>
        </div>
      </header>
      <!-- พื้นที่แสดงเนื้อหาของแท็บที่เลือก -->
      <main class="admin-main"><div class="card" id="content"><p class="muted">กำลังโหลด…</p></div></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/admin.js"></script>
  <script src="/account.js"></script>
</body>
</html>
